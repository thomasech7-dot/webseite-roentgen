<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Thomas Olesch TO Monogramm</title>
  <desc id="desc">Goldenes T und leicht versetztes O als Markenlogo.</desc>
  <defs>
    <linearGradient id="gold" x1="80" y1="50" x2="410" y2="460" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff0b8"/>
      <stop offset="0.18" stop-color="#d9aa4f"/>
      <stop offset="0.48" stop-color="#b77b25"/>
      <stop offset="0.72" stop-color="#f2c76d"/>
      <stop offset="1" stop-color="#8f5b16"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="1 0 0 0 0.82 0 1 0 0 0.55 0 0 1 0 0.18 0 0 0 0.38 0"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" fill="none"/>
  <g filter="url(#softGlow)" fill="url(#gold)">
    <text x="102" y="276" font-family="Bodoni 72, Didot, Georgia, 'Times New Roman', serif" font-size="272" font-weight="600" letter-spacing="-18">T</text>
    <text x="224" y="352" font-family="Bodoni 72, Didot, Georgia, 'Times New Roman', serif" font-size="244" font-weight="500" letter-spacing="-10">O</text>
  </g>
</svg>
